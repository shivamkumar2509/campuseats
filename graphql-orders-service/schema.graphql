type Dish {
  id: ID!
  name: String!
  price: Float!
  available: Boolean!
  restaurantId: Int
}

type Query {
  dishes: [Dish]
  dish(id: ID!): Dish
}

input AddDishInput {
  name: String!
  price: Float!
  restaurantId: Int!
}

input UpdateDishInput {
  id: ID!
  name: String
  price: Float
}

type Mutation {
  addDish(input: AddDishInput!): Dish
  updateDish(input: UpdateDishInput!): Dish
}