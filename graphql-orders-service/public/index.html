<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEats - Orders Service</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; }
        h1 { color: #333; }
        .container { display: flex; gap: 20px; }
        .list-section { flex: 2; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        li:last-child { border-bottom: none; }
        input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .price { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <h1>🍽️ CampusEats - Dishes List</h1>
    <div class="container">
        <div class="list-section">
            <h2>Available Dishes</h2>
            <ul id="dish-list">
                <li>Loading dishes...</li>
            </ul>
        </div>
        <div class="form-section">
            <h2>Add New Dish</h2>
            <form id="add-dish-form">
                <label>Dish Name:</label>
                <input type="text" id="name" required placeholder="e.g. Paneer Roll">
                
                <label>Price (₹):</label>
                <input type="number" id="price" required placeholder="e.g. 90">
                
                <label>Restaurant ID:</label>
                <input type="number" id="restaurantId" required placeholder="e.g. 1">
                
                <button type="submit">Add Dish</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:4000/';

        async function fetchDishes() {
            const query = `
                query {
                    dishes {
                        id
                        name
                        price
                        available
                    }
                }
            `;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const result = await response.json();
                const dishes = result.data.dishes;
                
                const list = document.getElementById('dish-list');
                list.innerHTML = '';
                dishes.forEach(dish => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${dish.name}</span> <span class="price">₹${dish.price}</span>`;
                    list.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching dishes:', error);
                document.getElementById('dish-list').innerHTML = '<li>Error loading dishes. Is server running?</li>';
            }
        }

        document.getElementById('add-dish-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const restaurantId = parseInt(document.getElementById('restaurantId').value);

            const mutation = `
                mutation {
                    addDish(input: { name: "${name}", price: ${price}, restaurantId: ${restaurantId} }) {
                        id
                        name
                        price
                    }
                }
            `;
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: mutation })
                });
                document.getElementById('add-dish-form').reset();
                fetchDishes(); // Refresh list
            } catch (error) {
                console.error('Error adding dish:', error);
            }
        });

        // Load dishes on page load
        fetchDishes();
    </script>
</body>
</html>
