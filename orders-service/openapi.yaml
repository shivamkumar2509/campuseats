openapi: 3.0.3
info:
  title: CampusEats Orders Service
  description: Order management service for CampusEats food delivery platform
  version: 1.0.0
  contact:
    name: Aman Tripathi
    email: aman@campuseats.com

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://orders.campuseats.edu/api
    description: Production server

paths:
  /orders:
    post:
      summary: Create a new order
      description: Creates a new food order with items and delivery details
      operationId: createOrder
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Unique key to prevent duplicate orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Malformed request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Duplicate order detected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Valid request but business rule violated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    get:
      summary: List orders with filters
      description: Retrieves a filtered list of orders
      operationId: listOrders
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          description: Filter by user ID
        - in: query
          name: vendorId
          schema:
            type: string
          description: Filter by vendor ID
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERED, CANCELLED]
          description: Filter by order status
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of orders to return
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of orders to skip
      responses:
        "200":
          description: List of orders retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          description: Invalid filter parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{orderId}:
    get:
      summary: Get order by ID
      description: Retrieves a single order by its unique identifier
      operationId: getOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID (UUID format)
      responses:
        "200":
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      description: Cancels an existing order with a reason
      operationId: cancelOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID to cancel
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Unique key to prevent duplicate cancellations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "202":
          description: Cancellation accepted (async processing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
        "400":
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Order cannot be cancelled (already delivered or cancelled)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          description: URI reference to problem type
          example: "https://campuseats.edu/errors/invalid-input"
        title:
          type: string
          description: Short human-readable summary
          example: "Invalid Input"
        status:
          type: integer
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Detailed explanation
          example: "Field 'userId' must be a valid UUID"
        instance:
          type: string
          description: URI reference to specific occurrence
          example: "/orders/abc-123"

    Address:
      type: object
      properties:
        building:
          type: string
          description: Campus building name
          example: "Academic Block A"
        room:
          type: string
          description: Room number
          example: "301"
        landmark:
          type: string
          description: Nearby landmark
          example: "Near Library"
        instructions:
          type: string
          description: Special delivery instructions
          example: "Call me when you reach"

    OrderItem:
      type: object
      properties:
        itemId:
          type: string
          example: "itm_789"
        name:
          type: string
          example: "Paneer Butter Masala"
        quantity:
          type: integer
          example: 2
        priceAtTime:
          type: number
          format: float
          example: 299.50
        specialInstructions:
          type: string
          example: "No onions please"

    CreateOrderRequest:
      type: object
      required:
        - userId
        - vendorId
        - items
        - deliveryAddress
      properties:
        userId:
          type: string
          example: "user_123"
        vendorId:
          type: string
          example: "vendor_456"
        items:
          type: array
          items:
            type: object
            required:
              - itemId
              - quantity
            properties:
              itemId:
                type: string
                example: "itm_789"
              quantity:
                type: integer
                minimum: 1
                example: 2
              specialInstructions:
                type: string
                example: "No onions"
        deliveryAddress:
          $ref: "#/components/schemas/Address"
        scheduleFor:
          type: string
          format: date-time
          description: Optional future delivery time
          example: "2026-09-10T14:30:00+05:30"

    CancelOrderRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum: [USER_REQUEST, VENDOR_REQUEST, OUT_OF_STOCK, OTHER]
          example: "USER_REQUEST"
        description:
          type: string
          example: "Changed my mind"

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          example: "ord_abc123"
        userId:
          type: string
          example: "user_123"
        vendorId:
          type: string
          example: "vendor_456"
        status:
          type: string
          enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERED, CANCELLED]
          example: "CONFIRMED"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          $ref: "#/components/schemas/Address"
        subtotal:
          type: number
          format: float
          example: 450.00
        tax:
          type: number
          format: float
          example: 36.00
        deliveryFee:
          type: number
          format: float
          example: 20.00
        grandTotal:
          type: number
          format: float
          example: 506.00
        createdAt:
          type: string
          format: date-time
          example: "2026-09-08T14:35:22+05:30"
        updatedAt:
          type: string
          format: date-time
          example: "2026-09-08T14:35:22+05:30"

    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    CancellationResponse:
      type: object
      properties:
        orderId:
          type: string
          example: "ord_abc123"
        status:
          type: string
          example: "CANCELLED"
        refundAmount:
          type: number
          format: float
          example: 506.00
        cancelledAt:
          type: string
          format: date-time
          example: "2026-09-08T14:40:22+05:30"
