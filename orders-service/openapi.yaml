openapi: 3.0.0

info:
  title: Orders Service API
  version: 1.0.0
  description: API for creating and retrieving orders

paths:
  /orders:
    post:
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - item_name
                - quantity
              properties:
                customer_name:
                  type: string
                item_name:
                  type: string
                quantity:
                  type: integer

      responses:
        "201":
          description: Order created successfully
        "400":
          description: Invalid request