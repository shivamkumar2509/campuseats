openapi: 3.0.3
info:
  title: CampusEats Orders Service
  description: Order management service with honest status codes and error handling
  version: 2.0.0
  contact:
    name: Aman Tripathi
    email: aman@campuseats.com

servers:
  - url: http://localhost:8080/api
    description: Development server

paths:
  /orders:
    post:
      summary: Create a new order
      operationId: createOrder
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Payment service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    
    get:
      summary: List orders
      operationId: listOrders
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Orders retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          description: Invalid filter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{orderId}:
    get:
      summary: Get order by ID
      operationId: getOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          schema:
            type: string
            enum: [application/json, application/xml]
      responses:
        '200':
          description: Order retrieved (JSON or XML)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
            application/xml:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      summary: Update order status
      operationId: updateOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERED, CANCELLED]
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Illegal transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      summary: Delete order
      operationId: deleteOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Order deleted
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Cannot delete delivered order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /orders/{orderId}/cancellation:
    post:
      summary: Cancel order
      operationId: cancelOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationResponse'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Illegal transition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'

components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: "https://campuseats.edu/errors/order-not-found"
        title:
          type: string
          example: "Order Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Order ord_abc123 not found"
    
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
              example:
                - field: "items"
                  message: "must be a non-empty array"
                - field: "items[0].quantity"
                  message: "must be an integer >= 1"
    
    Address:
      type: object
      required: [building]
      properties:
        building:
          type: string
        room:
          type: string
        landmark:
          type: string
        instructions:
          type: string
    
    CreateOrderRequest:
      type: object
      required: [userId, vendorId, items, deliveryAddress]
      properties:
        userId:
          type: string
          minLength: 1
        vendorId:
          type: string
          minLength: 1
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
        deliveryAddress:
          $ref: '#/components/schemas/Address'
    
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [USER_REQUEST, VENDOR_REQUEST, OUT_OF_STOCK, OTHER]
    
    OrderItem:
      type: object
      properties:
        itemId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        priceAtTime:
          type: number
        specialInstructions:
          type: string
    
    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
        vendorId:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERED, CANCELLED]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        subtotal:
          type: number
        tax:
          type: number
        deliveryFee:
          type: number
        grandTotal:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    
    CancellationResponse:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
        refundAmount:
          type: number
        cancelledAt:
          type: string
          format: date-time